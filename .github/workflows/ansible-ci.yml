---
name: ansible-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint molecule molecule-docker docker
          ansible-galaxy collection install -r requirements.yml
      - name: Run ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml

  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible molecule molecule-docker docker
          ansible-galaxy collection install -r requirements.yml
      - name: Run molecule
        run: molecule test -s default
